[project]
name = "py-cloud-task"

version = "0.3.0"
description = "A framework agnostic Google Cloud Tasks library for the Push architecture."
readme = "README.md"
requires-python = ">=3.14"
authors = [
    { name = "Ageu", email = "uhtred@ohrus.co" }
]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Framework :: FastAPI",
    "Topic :: System :: Distributed Computing",
]
dependencies = [
    "google-cloud-tasks>=2.21.0",
]

[project.optional-dependencies]
fastapi = [
    "fastapi>=0.129.0",
]
# httpx for eager="remote" (local worker simulation). "test" is the former name, kept as an alias.
remote = [
    "httpx>=0.28.1",
]
test = [
    "httpx>=0.28.1",
]
validation = [
    "pydantic>=2.0",
]

[build-system]
requires = ["uv_build>=0.9.29,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "cloudtask"
module-root = "src"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.15.1",
]


[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
