[project]
name = "py-cloud-task"
version = "0.1.0"
description = "A framework agnostic Google Cloud Tasks library for the Push architecture."
readme = "README.md"
requires-python = ">=3.14"
authors = [
    { name = "Ageu", email = "uhtred@ohrus.co" }
]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Framework :: FastAPI",
    "Framework :: Django",
    "Topic :: System :: Distributed Computing",
]
dependencies = [
    "google-cloud-tasks>=2.21.0",
]

[build-system]
requires = ["uv_build>=0.9.29,<0.10.0"]
build-backend = "uv_build"
