name: Publish to PyPI

# Runs when a version tag is pushed (e.g. git tag v1.0.0 && git push --tags).
on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-publish:
    name: Build and Publish to PyPI
    runs-on: ubuntu-latest

    permissions:
      id-token: write  # Trusted publishing: lets PyPI trust this workflow
      contents: read   # Needed to check out the code

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Lint
        run: uv run ruff check .

      - name: Run tests
        run: uv run pytest

      - name: Build Package
        run: uv build

      - name: Publish to PyPI
        run: uv publish